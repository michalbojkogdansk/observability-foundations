name: bimodal-demo-cache keepalive

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bimodal-demo worker to keep Upstash Redis active
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://bimodal-demo.michal-bojko-gdansk.workers.dev/product?id=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Keepalive ping failed with HTTP $code"
            exit 1
          fi
