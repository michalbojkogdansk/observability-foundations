<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Engineering Foundations</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="stylesheet" href="shared/style.css" />
</head>
<body class="min-h-screen">
<div id="site-nav"></div>

<main class="max-w-7xl mx-auto px-4 py-10">
 <!-- Hero -->
 <div class="text-center mb-10">
 <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3 text-black">
 Data Engineering Foundations
 </h1>
 <p class="text-slate-400 text-lg max-w-2xl mx-auto">Interactive visual lectures for data engineering concepts. Pick a topic, explore the visuals, run the algorithms.</p>
 </div>

 <!-- Topic Grid -->
 <div class="topic-grid" id="topic-grid"></div>
</main>

<footer class="text-center py-6 text-slate-500 text-xs border-t border-slate-800/30 mt-10">
 Built for conference demos &middot; Algorithms run 100% in your browser &middot; No data leaves your machine
</footer>

<script>
 function getPreferredTheme() {
 return localStorage.getItem('de-theme') || 'light';
 }
 function applyTheme(theme) {
 document.documentElement.classList.toggle('dark', theme === 'dark');
 localStorage.setItem('de-theme', theme);
 }
 function toggleTheme() {
 applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
 // Update toggle icon in nav
 var btn = document.getElementById('nav-theme-toggle');
 if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '🌙' : '☀️';
 }
 applyTheme(getPreferredTheme());

 // Render topic cards
 var topics = [
 { icon: '🔮', title: 'Clustering Showdown', desc: 'KMeans vs DBSCAN: interactive comparison with benchmarks, business analysis, and scaling tests.', href: 'clustering.html', status: 'live' },
 { icon: '📊', title: 'Bins & Histograms', desc: 'Understanding data distribution through binning strategies. Bin width, density plots, and skewness detection.', href: 'bins.html', status: 'live', tech: [
 { name: 'GitHub API', url: 'https://github.com/favicon.ico' },
 { name: 'Wikipedia', url: 'https://en.wikipedia.org/favicon.ico' },
 { name: 'Hacker News', url: 'https://news.ycombinator.com/favicon.ico' },
 { name: 'Open-Meteo', url: 'https://open-meteo.com/favicon-32x32.png' },
 ]},
 { icon: '🔥', title: 'Failure Detection', desc: 'From 47 alerts to 3 root causes. Interactive alert storm correlator: tune grouping rules and watch the noise collapse.', href: 'failure-detection.html', status: 'live' },
 { icon: '📈', title: 'Regression Analysis', desc: 'Linear, polynomial &amp; exponential regression on live Neon Postgres data, powered by Python/scipy on Render.com with Cloudflare edge caching.', href: 'regression.html', status: 'live', tech: [
              { icon: 'https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/render.svg', title: 'Render.com' },
              { icon: 'https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/neon.svg', title: 'Neon Postgres' },
              { icon: 'https://www.python.org/favicon.ico', title: 'scipy' },
              { icon: 'https://www.cloudflare.com/favicon.ico', title: 'Cloudflare Workers' },
              { icon: 'https://redis.io/favicon.ico', title: 'Redis' },
            ] },
 { icon: '⚡', title: 'Spikes & Anomaly Detection', desc: 'Detecting unusual spikes in metrics, traffic, and system behavior with statistical methods.', href: 'spikes.html', status: 'live', tech: [
              { icon: 'https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/render.svg', title: 'Render.com' },
              { icon: 'https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/neon.svg', title: 'Neon Postgres' },
              { icon: 'https://www.google.com/s2/favicons?domain=redpanda.com&sz=64', title: 'Redpanda' },
              { icon: 'https://redis.io/favicon.ico', title: 'Redis' },
              { icon: 'https://grafana.com/favicon.ico', title: 'Grafana' },
            ] },
 { icon: '📋', title: 'Log-Driven Development', desc: 'Using structured logging as a foundation for observability, debugging, and data pipelines.', href: 'log-driven.html', status: 'live' },
 { icon: '📡', title: 'Bimodal Latency', desc: 'Real HTTP requests to a live CF Worker + Azure PostgreSQL + Redis. Watch cache-aside create two latency peaks your average metric hides.', href: 'bimodal.html', status: 'live', tech: [
 { name: 'Cloudflare', url: 'https://www.cloudflare.com/favicon.ico' },
 { name: 'Azure PostgreSQL', url: 'https://azure.microsoft.com/favicon.ico' },
 { name: 'Redis', url: 'https://redis.io/favicon.ico' },
 ]},
 ];

 var grid = document.getElementById('topic-grid');
 grid.innerHTML = topics.map(function(t) {
 var badge = t.status === 'live'
 ? '<span class="status-live">● Live</span>'
 : '<span class="status-soon">🚧 Coming Soon</span>';
 var techBadges = '';
 if (t.tech && t.tech.length) {
 techBadges = '<div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-slate-700/50">' +
 t.tech.map(function(tech) {
         var icon = tech.icon || tech.url || '';
         var title = tech.title || tech.name || '';
         var isSvg = icon.indexOf('.svg') !== -1;
         var imgStyle = isSvg ? 'display:inline-block;vertical-align:middle;filter:brightness(0) saturate(100%) invert(35%) sepia(90%) saturate(400%) hue-rotate(200deg);' : 'display:inline-block;vertical-align:middle;';
         return '<span class="flex items-center justify-center bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-full p-1.5" title="' + title + '">' +
         '<img src="' + icon + '" width="16" height="16" alt="' + title + '" title="' + title + '" style="' + imgStyle + '" />' +
         '</span>';
       }).join('') +
 '</div>';
 }
 return '<a class="card topic-card" href="' + t.href + '">' +
 '<div class="flex items-center justify-between mb-3">' +
 '<span class="text-3xl">' + t.icon + '</span>' +
 badge +
 '</div>' +
 '<h2 class="text-lg font-bold mb-1.5 text-slate-200">' + t.title + '</h2>' +
 '<p class="text-sm text-slate-400 leading-relaxed">' + t.desc + '</p>' +
 techBadges +
 '</a>';
 }).join('');
</script>
<script src="shared/nav.js"></script>
</body>
</html>
